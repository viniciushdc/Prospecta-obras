name: Robô Prospecta Obras

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  prospectar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar robô (3 fontes)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python robo.py --limite 60

      - name: Salvar leads no repositório
        run: |
          git config user.name "robo-prospecta"
          git config user.email "robo@users.noreply.github.com"
          git add leads.json vistos.json leads_novos.csv 2>/dev/null || true
          git commit -m "Atualiza leads do dia [skip ci]" || echo "nada novo"
          git push || echo "sem push"

      - name: Disponibilizar o CSV também
        uses: actions/upload-artifact@v4
        with:
          name: leads-novos
          path: leads_novos.csv
          if-no-files-found: ignore
