name: Robô Prospecta Obras

on:
  schedule:
    # Toda segunda-feira às 08:00 de Brasília (11:00 UTC)
    - cron: "0 11 * * 1"
  workflow_dispatch: {}   # botão "Run workflow" para rodar na hora

jobs:
  prospectar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # guarda a memória de leads já vistos entre as execuções (dedupe)
      - name: Restaurar memória de leads
        uses: actions/cache@v4
        with:
          path: vistos.json
          key: vistos-${{ github.run_id }}
          restore-keys: vistos-

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar robô (3 fontes)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python robo.py --limite 60

      - name: Disponibilizar o CSV (baixável na aba Actions)
        uses: actions/upload-artifact@v4
        with:
          name: leads-novos
          path: leads_novos.csv
          if-no-files-found: ignore
