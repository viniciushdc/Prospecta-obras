<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Prospecta Obras — Civil Obras</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#18244C" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Prospecta Obras" />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root{ --navy:#18244C; --navy2:#243463; --orange:#E85A0C; --orange2:#F47B33; --gray:#595959; --bg:#eef1f7; --line:#e4e8f2; --muted:#7a83a0; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:Montserrat,-apple-system,sans-serif; background:var(--bg); color:var(--navy); padding-bottom:84px; }
  button{ font-family:inherit; cursor:pointer; }

  /* ---- barra institucional ---- */
  .instbar{ background:#fff; border-bottom:3px solid var(--orange); padding:9px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .co-mark{ display:flex; align-items:center; gap:9px; }
  .co-img{ height:34px; width:auto; }
  .co-word{ display:flex; align-items:center; gap:8px; }
  .co-c{ width:32px; height:32px; border-radius:7px; background:var(--navy); color:#fff; display:grid; place-items:center; font-weight:900; font-size:18px; border-bottom:3px solid var(--orange); }
  .co-txt b{ font-size:15px; font-weight:900; color:var(--navy); letter-spacing:.04em; display:block; line-height:1; }
  .co-txt b span{ color:var(--orange); }
  .co-txt small{ font-size:8.5px; color:var(--gray); font-weight:600; letter-spacing:.12em; }
  .flags{ display:flex; align-items:center; gap:14px; }
  .flag{ display:flex; align-items:center; gap:6px; }
  .flag svg{ border:1px solid #dfe3ee; border-radius:2px; display:block; }
  .flag small{ font-size:8.5px; color:var(--gray); font-weight:700; line-height:1.1; max-width:78px; }
  @media(max-width:620px){ .flag small{ display:none; } .co-txt small{ display:none; } .flags{ gap:8px; } }

  header.app{ background:linear-gradient(135deg,var(--navy),var(--navy2)); color:#fff; padding:13px 18px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  header.app .t b{ font-size:16px; font-weight:900; letter-spacing:.03em; }
  header.app .t b span{ color:var(--orange2); }
  header.app .t small{ font-size:10.5px; opacity:.75; display:block; margin-top:2px; font-weight:500; }

  main{ max-width:1180px; margin:0 auto; padding:16px 14px; }
  .row{ display:flex; gap:10px; flex-wrap:wrap; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:16px; }
  .kpi{ flex:1; min-width:148px; }
  .kpi .lab{ font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  .kpi .val{ font-size:24px; font-weight:900; margin-top:6px; line-height:1; }
  .kpi .sub2{ font-size:11.5px; color:#9aa2bb; margin-top:5px; font-weight:600; }
  h3{ margin:0 0 12px; font-size:13px; font-weight:800; }
  .bar-row{ display:flex; align-items:center; gap:8px; margin-bottom:7px; font-size:12px; }
  .bar-row .nm{ width:96px; flex-shrink:0; font-weight:600; color:#5a627d; font-size:11px; text-align:right; }
  .bar-track{ flex:1; background:var(--bg); border-radius:6px; height:16px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:6px; min-width:3px; transition:width .4s; }
  .bar-row .ct{ width:22px; font-weight:800; font-size:11px; }
  .lead{ display:flex; gap:12px; align-items:center; background:#fff; border:1px solid var(--line); border-radius:12px; padding:13px; margin-bottom:9px; }
  .ring{ width:42px; height:42px; border-radius:50%; display:grid; place-items:center; flex-shrink:0; }
  .ring i{ width:32px; height:32px; border-radius:50%; background:#fff; display:grid; place-items:center; font-weight:900; font-size:12.5px; font-style:normal; }
  .lead .body{ flex:1; min-width:0; cursor:pointer; }
  .lead .nm{ font-weight:800; font-size:14px; }
  .badge{ font-size:9.5px; font-weight:800; color:#fff; padding:2px 7px; border-radius:20px; margin-left:7px; }
  .meta{ display:flex; gap:12px; margin-top:5px; flex-wrap:wrap; font-size:11.5px; color:#9aa2bb; font-weight:600; }
  .del{ background:none; border:none; color:#c8cdde; font-size:18px; padding:4px; }
  input,select,textarea{ width:100%; padding:10px 12px; border-radius:8px; border:1px solid #d4d9e6; font-size:14px; font-family:inherit; color:var(--navy); background:#fff; outline:none; }
  label.f{ display:block; margin-bottom:12px; }
  label.f span{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--navy2); display:block; margin-bottom:5px; }
  .btn{ border:none; border-radius:9px; padding:10px 14px; font-weight:800; font-size:13px; display:inline-flex; align-items:center; gap:6px; }
  .btn-o{ background:var(--orange); color:#fff; } .btn-n{ background:var(--navy); color:#fff; } .btn-g{ background:var(--bg); color:var(--navy); }
  nav{ position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid #dde2ee; display:flex; padding:8px 4px; box-shadow:0 -2px 12px rgba(24,36,76,.08); z-index:30; }
  nav button{ flex:1; background:none; border:none; padding:6px; font-size:12px; font-weight:600; color:#8089a3; }
  nav button.on{ color:var(--orange); font-weight:800; }
  .overlay{ position:fixed; inset:0; background:rgba(24,36,76,.55); z-index:50; display:flex; align-items:flex-end; justify-content:center; }
  .sheet{ background:#fff; border-radius:18px 18px 0 0; padding:18px; width:100%; max-width:560px; max-height:92vh; overflow-y:auto; }
  .pill{ font-size:11px; font-weight:700; padding:4px 9px; border-radius:20px; background:var(--bg); color:var(--navy); border:none; }
  .col{ min-width:230px; width:230px; flex-shrink:0; }
</style>
</head>

 {empresa:"Cooperativa Santa Clara",org:"Cooperativa",uf:"RS",municipio:"",local:"",tipoObra:"Estrutura Industrial Geral",fonte:"Notícia / Anúncio",valor:200000000,contato:"A identificar",cargo:"A identificar",tel:"",email:"",status:"Mapeado",data:"02/03/2026",notas:"R$200mi entre 2026-2027 para ampliar produção, distribuição e armazenamento (setor lácteo) - sinal forte e adiantado | guaiba.online"},
 {empresa:"Grupo Basso & Pancotte",org:"Agroindústria",uf:"RS",municipio:"Nova Alvorada",local:"",tipoObra:"Estrutura Industrial Geral",fonte:"Notícia / Anúncio",valor:50000000,contato:"A identificar",cargo:"A identificar",tel:"",email:"",status:"Mapeado",data:"10/10/2024",notas:"R$50mi+ unidade fabril de produtos agropecuários, veterinários e pets; verificar status | estado.rs.gov.br"},

const uid=()=> "l"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const brl=n=> (Number(n)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
const slug=s=> (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"");
const chave=l=> slug(l.empresa)+"|"+slug(l.municipio)+"|"+slug(l.tipoObra);
function score(l){let s=0; s+=SRC_SCORE[l.fonte]||0; if(l.tipoObra)s+=15; s+=ROLE_SCORE[l.cargo]||0;
  const v=Number(l.valor)||0; if(v>=15e6)s+=15; else if(v>=5e6)s+=10; else if(v>0)s+=5;
  if(PRI.includes(l.uf))s+=10; if(l.contato&&l.contato!=="A identificar")s+=5; return Math.min(100,s);}
const temp=s=> s>=70?"Quente":s>=45?"Morno":"Frio";
const TCOLOR={Quente:ORANGE,Morno:"#eab308",Frio:"#64748b"};

function load(){ try{const r=localStorage.getItem(KEY); if(r){LEADS=JSON.parse(r); return;}}catch(e){} LEADS=SEED.slice(); save(); }

// Busca o leads.json (gerado pelo robô) e funde com o que já existe,
// preservando o que você já mexeu (funil, notas). Só adiciona os novos.
async function syncRemote(){
  try{
    const res = await fetch('leads.json?v='+Date.now(), {cache:'no-store'});
    if(!res.ok) return;
    const remote = await res.json();
    if(!Array.isArray(remote)) return;
    const seen = new Set(LEADS.map(chave));
    let add = 0;
    remote.forEach(r=>{
      if(!r || !r.empresa) return;
      const k = chave(r);
      if(!seen.has(k)){ seen.add(k); LEADS.unshift({...r, id:uid(), criado:Date.now()}); add++; }
    });
    if(add){ save(); render(); }
    const el=document.getElementById('syncMsg');
    if(el){ el.textContent = add ? (add+' novo(s) lead(s) hoje') : 'Tudo atualizado'; }
  }catch(e){ /* offline: segue com o que tem salvo */ }
}
function save(){ try{localStorage.setItem(KEY,JSON.stringify(LEADS));}catch(e){} }

function toCSV(rows){ const esc=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
  return HEADER.join(",")+"\n"+rows.map(l=>HEADER.map(h=>h==="valor"?(Number(l.valor)||0):esc(l[h])).join(",")).join("\n"); }
function parseCSV(text){ const lines=text.replace(/\r/g,"").split("\n").filter(x=>x.trim()); if(lines.length<2)return [];
  const pl=line=>{const o=[];let c="",q=false;for(let i=0;i<line.length;i++){const ch=line[i];
    if(ch==='"'){ if(q&&line[i+1]==='"'){c+='"';i++;} else q=!q; } else if(ch===","&&!q){o.push(c);c="";} else c+=ch;} o.push(c); return o;};
  const head=pl(lines[0]).map(h=>h.trim().toLowerCase()); const ix=n=>head.indexOf(n);
  return lines.slice(1).map(line=>{const c=pl(line); const g=n=>ix(n)>=0?(c[ix(n)]||"").trim():"";
    return {id:uid(),empresa:g("empresa"),org:ORG_TYPES.includes(g("org"))?g("org"):"Cooperativa",
      uf:(g("uf")||"PR").toUpperCase(),municipio:g("municipio"),local:g("local"),
      tipoObra:WORK_TYPES.includes(g("tipoobra"))?g("tipoobra"):"Estrutura Industrial Geral",
      fonte:SOURCES.includes(g("fonte"))?g("fonte"):"Prospecção Fria",
      valor:Number(String(g("valor")).replace(/\D/g,""))||0,
      contato:g("contato")||"A identificar",cargo:ROLES.includes(g("cargo"))?g("cargo"):"A identificar",
      tel:g("tel"),email:g("email"),status:STATUSES.includes(g("status"))?g("status"):"Mapeado",
      data:g("data"),notas:g("notas"),criado:Date.now()};
  }).filter(l=>l.empresa); }

function importCSV(){ document.getElementById("fileIn").click(); }
document.getElementById("fileIn").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f)return; const rd=new FileReader();
  rd.onload=()=>{ const rows=parseCSV(rd.result); const seen=new Set(LEADS.map(chave)); let add=0;
    rows.forEach(r=>{ const k=chave(r); if(!seen.has(k)){ seen.add(k); LEADS.unshift(r); add++; } });
    save(); setView("leads"); alert(add+" leads novos importados ("+(rows.length-add)+" já existiam).");
  }; rd.readAsText(f,"UTF-8"); e.target.value="";
});
function exportCSV(){ const blob=new Blob([toCSV(LEADS)],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="prospecta-obras.csv"; a.click(); }

function setView(v){ VIEW=v; ["painel","funil","leads"].forEach(x=>{
  document.getElementById("view-"+x).style.display = x===v?"block":"none";
  document.getElementById("nav-"+x).className = x===v?"on":""; }); render(); }

function ringHTML(s){ const c=TCOLOR[temp(s)];
  return `<div class="ring" style="background:conic-gradient(${c} ${s*3.6}deg,#eef1f7 0)"><i style="color:${c}">${s}</i></div>`; }
function decisorTxt(l){ const c=l.cargo&&l.cargo!=="A identificar"?l.cargo:""; const n=l.contato&&l.contato!=="A identificar"?l.contato:"";
  if(n&&c) return `👤 ${n} (${c})`; if(n) return `👤 ${n}`; if(c) return `👤 ${c}`; return `👤 decisor a identificar`; }
const mapQuery=l=> encodeURIComponent([l.local,l.municipio,l.uf,"Brasil"].filter(Boolean).join(", "));
const mapLink=l=> `https://www.google.com/maps/search/?api=1&query=${mapQuery(l)}`;
const localTxt=l=> l.local?`${l.local}, ${l.municipio}/${l.uf}`:`${l.municipio}/${l.uf}`;

function render(){
  const ativos=LEADS.filter(l=>l.status!=="Perdido"&&l.status!=="Ganho");
  const pipe=LEADS.filter(l=>l.status!=="Perdido").reduce((a,l)=>a+(Number(l.valor)||0),0);
  const quentes=LEADS.filter(l=>l.status!=="Perdido"&&temp(score(l))==="Quente").length;
  const ganhos=LEADS.filter(l=>l.status==="Ganho").length;
  const fech=LEADS.filter(l=>l.status==="Ganho"||l.status==="Perdido").length;
  const conv=fech?Math.round(ganhos/fech*100):0;

  if(VIEW==="painel"){
    const maxS=Math.max(1,...STATUSES.map(s=>LEADS.filter(l=>l.status===s).length));
    const obras=WORK_TYPES.map(t=>({t,n:LEADS.filter(l=>l.tipoObra===t).length})).filter(x=>x.n);
    const maxO=Math.max(1,...obras.map(o=>o.n));
    const hot=ativos.map(l=>({...l,s:score(l)})).sort((a,b)=>b.s-a.s).slice(0,6);
    document.getElementById("view-painel").innerHTML=`
      <div class="row" style="margin-bottom:16px">
        <div class="card kpi"><div class="lab">Pipeline ativo</div><div class="val" style="color:${ORANGE}">${brl(pipe)}</div><div class="sub2">${ativos.length} alvos em andamento</div></div>
        <div class="card kpi"><div class="lab">Leads quentes</div><div class="val">${quentes}</div><div class="sub2">score ≥ 70</div></div>
        <div class="card kpi"><div class="lab">Total mapeado</div><div class="val">${LEADS.length}</div><div class="sub2">todas as origens</div></div>
        <div class="card kpi"><div class="lab">Conversão</div><div class="val" style="color:#16a34a">${conv}%</div><div class="sub2">ganhos / fechados</div></div>
      </div>
      <div class="row" style="margin-bottom:16px">
        <div class="card" style="flex:1 1 320px"><h3>Funil por etapa</h3>
          ${STATUSES.map(s=>{const n=LEADS.filter(l=>l.status===s).length;
            return `<div class="bar-row"><div class="nm">${s}</div><div class="bar-track"><div class="bar-fill" style="width:${n/maxS*100}%;background:${SCOLOR[s]}"></div></div><div class="ct">${n}</div></div>`;}).join("")}
        </div>
        <div class="card" style="flex:1 1 280px"><h3>Tipos de obra</h3>
          ${obras.length?obras.map(o=>`<div class="bar-row"><div class="nm">${o.t.split(" / ")[0]}</div><div class="bar-track"><div class="bar-fill" style="width:${o.n/maxO*100}%;background:${ORANGE}"></div></div><div class="ct">${o.n}</div></div>`).join(""):'<p style="color:#9aa2bb;font-size:13px">Sem dados.</p>'}
        </div>
      </div>
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">
          <h3 style="margin:0;color:${ORANGE}">🔥 Prioridade da semana</h3>
          <div style="display:flex;gap:8px">
            <button class="btn btn-g" onclick="importCSV()">Importar CSV</button>
            <button class="btn btn-g" onclick="exportCSV()">Exportar</button>
          </div>
        </div>
        ${hot.length?hot.map(l=>`<div class="lead" style="border:none;border-bottom:1px solid #f0f2f8;border-radius:0;padding:10px 0;margin:0">
          ${ringHTML(l.s)}
          <div class="body" onclick="openLead('${l.id}')"><div class="nm">${l.empresa}</div><div class="meta"><span>${l.tipoObra}</span><span>${l.municipio}/${l.uf}</span>${l.data?`<span>🗓 ${l.data}</span>`:""}</div></div>
          <div style="text-align:right"><div style="font-weight:800;font-size:12.5px">${brl(l.valor)}</div><span style="font-size:10px;font-weight:800;color:${SCOLOR[l.status]}">${l.status}</span></div>
        </div>`).join(""):'<p style="color:#9aa2bb;font-size:13px">Nenhum alvo ativo. Importe o CSV do robô ou cadastre um lead.</p>'}
      </div>`;
  }

  if(VIEW==="funil"){
    document.getElementById("view-funil").innerHTML=`
      <p style="font-size:12.5px;color:#7a83a0;font-weight:600;margin:0 0 12px">Use ◀ ▶ para mover o alvo no funil. Toque no nome para editar.</p>
      <div class="row" style="flex-wrap:nowrap;overflow-x:auto;padding-bottom:8px;gap:12px">
      ${STATUSES.map(s=>{const col=LEADS.filter(l=>l.status===s); const v=col.reduce((a,l)=>a+(Number(l.valor)||0),0);
        return `<div class="col">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px"><span style="width:9px;height:9px;border-radius:3px;background:${SCOLOR[s]}"></span><b style="font-size:12.5px">${s}</b><span style="margin-left:auto;font-size:11px;color:#9aa2bb;font-weight:700">${col.length}</span></div>
          <div style="font-size:10.5px;color:#9aa2bb;font-weight:700;margin-bottom:8px">${brl(v)}</div>
          ${col.map(l=>{const sc=score(l); return `<div class="card" style="padding:11px;margin-bottom:8px;border-left:4px solid ${SCOLOR[s]}">
            <div class="body" onclick="openLead('${l.id}')"><div style="display:flex;justify-content:space-between"><b style="font-size:12.5px">${l.empresa}</b><span style="font-size:10px;font-weight:900;color:${TCOLOR[temp(sc)]}">${sc}</span></div>
            <div style="font-size:10.5px;color:#7a83a0;font-weight:600;margin-top:4px">${l.tipoObra}</div>
            <div style="font-size:10.5px;color:#9aa2bb;margin-top:2px">${l.municipio}/${l.uf} · ${brl(l.valor)}${l.data?" · "+l.data:""}</div></div>
            <div style="display:flex;justify-content:space-between;margin-top:8px">
              <button class="pill" onclick="move('${l.id}',-1)">◀</button><button class="pill" onclick="move('${l.id}',1)">▶</button></div>
          </div>`;}).join("")||'<div style="font-size:11px;color:#c0c6d8;text-align:center;padding:10px">—</div>'}
        </div>`;}).join("")}
      </div>`;
  }

  if(VIEW==="leads"){
    window._f=window._f||{q:"",uf:"Todos",obra:"Todos",st:"Todos"};
    const f=window._f;
    let list=LEADS.filter(l=>{
      if(f.uf!=="Todos"&&l.uf!==f.uf)return false;
      if(f.obra!=="Todos"&&l.tipoObra!==f.obra)return false;
      if(f.st!=="Todos"&&l.status!==f.st)return false;
      if(f.q&&!(`${l.empresa} ${l.municipio} ${l.tipoObra} ${l.contato}`.toLowerCase().includes(f.q.toLowerCase())))return false;
      return true;}).sort((a,b)=>score(b)-score(a));
    const opt=(arr,sel)=>["Todos",...arr].map(o=>`<option ${o===sel?"selected":""}>${o}</option>`).join("");
    document.getElementById("view-leads").innerHTML=`
      <div class="row" style="margin-bottom:10px">
        <input style="flex:1" placeholder="Buscar empresa, cidade, obra…" value="${f.q}" oninput="window._f.q=this.value;render()" />
        <button class="btn btn-n" onclick="importCSV()" title="Importar CSV do robô">⬆</button>
        <button class="btn btn-n" onclick="exportCSV()" title="Exportar">⬇</button>
      </div>
      <div class="row" style="margin-bottom:14px">
        <select onchange="window._f.uf=this.value;render()" style="flex:1">${opt(UFS,f.uf)}</select>
        <select onchange="window._f.obra=this.value;render()" style="flex:1">${opt(WORK_TYPES,f.obra)}</select>
        <select onchange="window._f.st=this.value;render()" style="flex:1">${opt(STATUSES,f.st)}</select>
      </div>
      <div style="font-size:11.5px;color:#9aa2bb;font-weight:700;margin-bottom:8px">${list.length} de ${LEADS.length} alvos</div>
      ${list.map(l=>{const sc=score(l); return `<div class="lead">
        ${ringHTML(sc)}
        <div class="body" onclick="openLead('${l.id}')">
          <div><span class="nm">${l.empresa}</span><span class="badge" style="background:${SCOLOR[l.status]}">${l.status}</span></div>
          <div style="font-size:12px;color:#7a83a0;font-weight:600;margin-top:3px">${l.tipoObra} · <span style="color:#aeb4c9">${l.fonte}</span></div>
          <div class="meta"><span>📍 ${localTxt(l)}</span><a href="${mapLink(l)}" target="_blank" rel="noreferrer" onclick="event.stopPropagation()" style="color:#0ea5e9;font-weight:700;text-decoration:none">🗺 mapa</a><span>${decisorTxt(l)}</span>${l.data?`<span>🗓 ${l.data}</span>`:""}<span style="color:${ORANGE};font-weight:800">${brl(l.valor)}</span></div>
        </div>
        <button class="del" onclick="rmLead('${l.id}')">🗑</button>
      </div>`;}).join("")||'<div style="text-align:center;color:#9aa2bb;padding:30px;font-size:13px">Nenhum alvo com esses filtros.</div>'}`;
  }
}

function move(id,d){ LEADS=LEADS.map(l=>{ if(l.id!==id)return l; let i=STATUSES.indexOf(l.status)+d;
  i=Math.max(0,Math.min(STATUSES.length-1,i)); return {...l,status:STATUSES[i]}; }); save(); render(); }
function rmLead(id){ if(confirm("Excluir este alvo?")){ LEADS=LEADS.filter(l=>l.id!==id); save(); render(); } }

function openLead(id){
  const l = id ? LEADS.find(x=>x.id===id) : null;
  EDIT = l || {empresa:"",org:"Cooperativa",uf:"PR",municipio:"",local:"",tipoObra:WORK_TYPES[0],fonte:"Licença Ambiental",valor:"",contato:"A identificar",cargo:"A identificar",tel:"",email:"",status:"Mapeado",data:"",notas:""};
  const sel=(arr,v)=>arr.map(o=>`<option ${o===v?"selected":""}>${o}</option>`).join("");
  const o=document.createElement("div"); o.className="overlay"; o.id="modal";
  o.onclick=e=>{ if(e.target===o) closeModal(); };
  o.innerHTML=`<div class="sheet">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <h2 style="margin:0;font-size:16px;font-weight:900">${id?"Editar alvo":"Novo alvo"}</h2>
      <div id="ringbox">${ringHTML(score(EDIT))}</div>
    </div>
    <label class="f"><span>Empresa / Cooperativa</span><input id="m_empresa" value="${EDIT.empresa||""}" placeholder="Ex.: Cooperativa Lar"/></label>
    <div class="row"><label class="f" style="flex:1"><span>Organização</span><select id="m_org">${sel(ORG_TYPES,EDIT.org)}</select></label>
      <label class="f" style="width:90px"><span>UF</span><select id="m_uf">${sel(UFS,EDIT.uf)}</select></label></div>
    <label class="f"><span>Município</span><input id="m_municipio" value="${EDIT.municipio||""}"/></label>
    <label class="f"><span>Local / endereço da obra</span><input id="m_local" value="${EDIT.local||""}" placeholder="Bairro, distrito, rodovia, ponto de referência (se souber)"/></label>
    <label class="f"><span>Tipo de obra</span><select id="m_tipoObra">${sel(WORK_TYPES,EDIT.tipoObra)}</select></label>
    <div class="row"><label class="f" style="flex:1"><span>Sinal / origem</span><select id="m_fonte">${sel(SOURCES,EDIT.fonte)}</select></label>
      <label class="f" style="flex:1"><span>Valor (R$)</span><input id="m_valor" inputmode="numeric" value="${EDIT.valor||""}" placeholder="15000000"/></label></div>
    <div class="row"><label class="f" style="flex:1"><span>Decisor (contato)</span><input id="m_contato" value="${EDIT.contato||""}"/></label>
      <label class="f" style="flex:1"><span>Cargo do decisor</span><select id="m_cargo">${sel(ROLES,EDIT.cargo)}</select></label></div>
    <div class="row"><label class="f" style="flex:1"><span>Telefone</span><input id="m_tel" value="${EDIT.tel||""}"/></label>
      <label class="f" style="flex:1"><span>E-mail</span><input id="m_email" value="${EDIT.email||""}"/></label></div>
    <div class="row"><label class="f" style="flex:1"><span>Etapa do funil</span><select id="m_status">${sel(STATUSES,EDIT.status)}</select></label>
      <label class="f" style="flex:1"><span>Data da publicação</span><input id="m_data" value="${EDIT.data||""}" placeholder="dd/mm/aaaa"/></label></div>
    <label class="f"><span>Notas</span><textarea id="m_notas" style="min-height:60px">${EDIT.notas||""}</textarea></label>
    <div class="row" style="margin-top:4px">
      ${id?`<button class="btn" style="background:#fff;color:#dc2626;border:1px solid #f3c5c5" onclick="rmLead('${id}');closeModal()">Excluir</button>`:""}
      <button class="btn btn-o" style="flex:1;justify-content:center;padding:12px" onclick="saveLead('${id||""}')">✓ Salvar alvo</button>
    </div>
  </div>`;
  document.body.appendChild(o);
  ["m_fonte","m_valor","m_cargo","m_uf","m_contato","m_tipoObra"].forEach(i2=>{const el=document.getElementById(i2); if(el){el.addEventListener("input",liveScore); el.addEventListener("change",liveScore);}});
}
const val=id=>{const e=document.getElementById(id); return e?e.value:"";};
function liveScore(){ const d={fonte:val("m_fonte"),tipoObra:val("m_tipoObra"),cargo:val("m_cargo"),valor:Number(String(val("m_valor")).replace(/\D/g,"")),uf:val("m_uf"),contato:val("m_contato")};
  document.getElementById("ringbox").innerHTML=ringHTML(score(d)); }
function closeModal(){ const m=document.getElementById("modal"); if(m)m.remove(); }
function saveLead(id){
  const d={empresa:val("m_empresa").trim(),org:val("m_org"),uf:val("m_uf"),municipio:val("m_municipio").trim(),local:val("m_local").trim(),
    tipoObra:val("m_tipoObra"),fonte:val("m_fonte"),valor:Number(String(val("m_valor")).replace(/\D/g,""))||0,
    contato:val("m_contato").trim()||"A identificar",cargo:val("m_cargo"),tel:val("m_tel").trim(),email:val("m_email").trim(),
    status:val("m_status"),data:val("m_data").trim(),notas:val("m_notas").trim()};
  if(!d.empresa){ alert("Informe o nome da empresa."); return; }
  if(id){ LEADS=LEADS.map(l=>l.id===id?{...l,...d}:l); }
  else { LEADS.unshift({...d,id:uid(),criado:Date.now()}); }
  save(); closeModal(); render();
}

load(); render(); syncRemote();
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
</body>
</html>
